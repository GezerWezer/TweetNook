    <!-- RIGHT DETAIL PANEL (split mode only when both columns fit) -->
    <div x-show="splitPanel && panelStack.length > 0" x-cloak x-ref="detailPanel"
         class="nook-detail-panel flex flex-col w-[600px] flex-shrink-0 border-x border-[var(--border-color)] bg-[var(--bg-primary)] h-screen sticky top-0 overflow-y-auto">
        
        <!-- Panel Header -->
        <div data-video-occluder class="sticky top-0 z-20 bg-[var(--bg-header)] backdrop-blur-md p-4 border-b border-[var(--border-color)] flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <button x-show="panelStack.length > 1" @click="panelGoBack()" class="p-2 -ml-2 rounded-full hover-bg transition">
                    <svg viewBox="0 0 24 24" class="w-5 h-5 fill-[var(--white-icon)]" fill="currentColor"><path d="m12.41 6-5 5H20v2H7.41l5 5L11 19.41 3.59 12 11 4.59z" /></svg>
                </button>
                <h2 class="text-xl font-bold text-[var(--text-primary)]" x-text="panelMode === 'quotes' ? 'Quote Tweets' : (articleForTweet(panelThreadData?.main) ? 'Article' : 'Tweet')"></h2>
            </div>
            <div class="article-header-actions">
                <button x-cloak x-show="panelMode === 'thread' && articleForTweet(panelThreadData?.main)" type="button" class="article-focus-toggle" @click.stop="openArticleFocus(panelThreadData.main)" aria-label="Open article focus mode" title="Focus mode"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M11.46 13.96 6.4 19H11v2H3v-8h2v4.59l5.04-5.05zM21 11h-2V6.41l-5.04 5.05-1.42-1.42L17.6 5H13V3h8z" /></svg><span class="article-focus-label">Focus mode</span></button>
                <button @click="closePanel()" class="p-2 rounded-full hover-bg transition text-[var(--text-secondary)] hover:text-[var(--text-primary)]">
                    <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current" fill="currentColor"><path d="M18.7 6.7 13.42 12l5.3 5.3-1.42 1.4-5.3-5.29-5.28 5.3-1.42-1.42L10.6 12 5.3 6.7l1.42-1.4L12 10.58l5.3-5.3z" /></svg>
                </button>
            </div>
        </div>

        <!-- Panel Thread View -->
        <div x-show="panelMode === 'thread'" class="pb-20">
            <template x-if="panelLoadingThread"><div class="p-8 text-center text-gray-500">Loading thread...</div></template>
            
            <template x-if="!panelLoadingThread && panelThreadData">
                <div>
                    <!-- PARENTS -->
                    <template x-for="(parent, index) in panelThreadData.parents" :key="parent.tweet_id">
                        <div class="px-4 pt-3 flex relative cursor-pointer hover-bg" :data-thread-id="parent.tweet_id" @click="openThread(parent.tweet_id, false, true)">
                            <template x-if="index > 0">
                                <div class="thread-connector-up w-0.5 bg-[var(--thread-line)] absolute top-0 left-[36px] -translate-x-1/2 z-0"></div>
                            </template>
                            <div class="thread-connector-down w-0.5 bg-[var(--thread-line)] absolute bottom-0 left-[36px] -translate-x-1/2 z-0"></div>
                            <div class="avatar w-10 h-10 rounded-full flex-shrink-0 relative bg-[var(--gray-700)] flex items-center justify-center font-bold text-[var(--white-icon)] uppercase overflow-hidden z-10 mr-2" @click.stop="openProfileCard($event, parent)">
                                <span class="avatar-initial" x-text="getInitial(parent)"></span>
                                <img :src="avatarUrl(parent.author.id)" @load="avatarLoaded($el)" @error="avatarFailed($el)" class="avatar-image absolute inset-0 w-full h-full object-cover z-10" loading="lazy">
                            </div>
                            <div class="flex-1 min-w-0 z-10">
                                <div class="tweet-byline flex items-center space-x-1 text-[15px]">
                                    <span class="font-bold text-[var(--text-primary)] truncate hover:underline tweet-byline-name" @click.stop="openProfileCard($event, parent)" x-text="parent.author.display_name || 'Unknown'"></span>
                                    <span class="text-[var(--text-secondary)] tweet-byline-detail tweet-byline-handle" x-text="'@' + (parent.author.username || 'unknown')"></span>
                                    <span class="text-[var(--text-secondary)]">·</span>
                                    <div class="roll-wrapper text-[var(--text-secondary)] tweet-byline-detail" @click.stop>
                                        <div class="roll-inner">
                                            <span class="roll-item hover:underline" x-text="formatDate(parent.created_at)"></span>
                                            <span class="roll-item text-[var(--accent-color)] text-[13px] font-medium" x-text="formatSyncDate(parent)"></span>
                                        </div>
                                    </div>
                                </div>
                                <template x-if="getReplyRecipients(parent).length">
                                    <div class="tweet-reply-context text-[15px] text-[var(--text-secondary)] mb-1" x-html="renderReplyRecipientContent(parent)" @click="handleReplyRecipientClick($event)"></div>
                                </template>
                                <div class="tweet-text text-[15px] whitespace-pre-wrap break-words" x-html="formatText(parent)" @click="handleTextClick($event)"></div>
                                <div x-html="renderCard(parent)" @click.stop></div>
                                <div x-html="renderMediaGrid(parent.media, 'feed', parent)" @click="stopMediaClick($event)"></div>
                                <div x-html="renderQuoteCard(parent)" @click.stop="handleThreadParentQuoteClick($event, parent)" @load.capture="avatarEvent($event)" @error.capture="avatarEvent($event)"></div>
                                <div x-html="renderCommunityNote(parent.raw_json)" @click.stop></div>
                                <div x-html="renderActionBar(parent)"></div>
                            </div>
                        </div>
                    </template>

                    <!-- MAIN TWEET -->
                    <div class="px-4 pt-3 pb-3 tweet-border relative" data-thread-main="panel">
                        <template x-if="panelThreadData.parents.length > 0">
                            <div class="thread-connector-up absolute w-0.5 bg-[var(--thread-line)] top-0 left-[36px] -translate-x-1/2 z-0"></div>
                        </template>
                        <div class="tweet-detail-header flex space-x-2 relative z-10">
                            <div class="avatar w-10 h-10 rounded-full flex-shrink-0 relative bg-[var(--gray-700)] flex items-center justify-center font-bold text-[var(--white-icon)] uppercase overflow-hidden cursor-pointer" @click.stop="openProfileCard($event, panelThreadData.main)">
                                <span class="avatar-initial" x-text="getInitial(panelThreadData.main)"></span>
                                <img :src="avatarUrl(panelThreadData.main.author.id)" @load="avatarLoaded($el)" @error="avatarFailed($el)" class="avatar-image absolute inset-0 w-full h-full object-cover z-10" loading="lazy">
                            </div>
                            <div class="cursor-pointer flex-1" @click.stop="openProfileCard($event, panelThreadData.main)">
                                <div class="font-bold text-[var(--text-primary)] hover:underline" x-text="panelThreadData.main.author.display_name || 'Unknown'"></div>
                                <div class="text-[var(--text-secondary)]" x-text="'@' + (panelThreadData.main.author.username || 'unknown')"></div>
                            </div>
                            <span class="tweet-detail-missing" x-html="missingBadge(panelThreadData.main)" @click.stop="openTweetHistory(panelThreadData.main.tweet_id)"></span>
                            <div class="relative -mr-2 -mt-2 flex-shrink-0" @click.outside="closeTweetMenu('panel:' + panelThreadData.main.tweet_id)" @keydown.escape.window="closeTweetMenu('panel:' + panelThreadData.main.tweet_id)">
                                <button type="button"
                                        class="w-9 h-9 rounded-full flex items-center justify-center text-[var(--text-secondary)] hover:text-[var(--accent-color)] hover:bg-[color-mix(in_srgb,var(--accent-color)_10%,transparent)] select-none touch-manipulation"
                                        aria-label="More actions" aria-haspopup="menu"
                                        :aria-expanded="tweetMenuOpen === 'panel:' + panelThreadData.main.tweet_id"
                                        :class="{ 'opacity-0': tweetMenuOpen === 'panel:' + panelThreadData.main.tweet_id }"
                                        title="More actions (hold for Tags)"
                                        @pointerdown.stop="startTweetMenuPress($event, panelThreadData.main.tweet_id, panelThreadData.main.media_tags)"
                                        @pointerup.stop="cancelTweetMenuPress()"
                                        @pointercancel.stop="cancelTweetMenuPress()"
                                        @pointerleave="cancelTweetMenuPress()"
                                        @click.stop="toggleTweetMenu('panel:' + panelThreadData.main.tweet_id)">
                                    <svg viewBox="0 0 24 24" class="w-[18px] h-[18px] fill-current" aria-hidden="true" fill="currentColor"><circle cx="5" cy="12" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="19" cy="12" r="2" /></svg>
                                </button>
                                <div x-show="tweetMenuOpen === 'panel:' + panelThreadData.main.tweet_id" x-cloak
                                     x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                                     x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                                     class="absolute right-0 top-0 z-50 w-56 origin-top-right overflow-hidden rounded-xl border border-[var(--border-color)] bg-[var(--dropdown-bg)] shadow-2xl"
                                     role="menu">
                                    <button type="button" role="menuitem" @click.stop="openTagsFromTweetMenu(panelThreadData.main.tweet_id, panelThreadData.main.media_tags)"
                                            class="flex w-full items-center gap-3 px-4 py-3 text-left text-[15px] font-bold text-[var(--text-primary)] hover:bg-[var(--hover-bg)]">
                                        <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current flex-shrink-0" aria-hidden="true" fill="currentColor"><path d="M9 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4" /><path d="M7.04 2a3.5 3.5 0 0 0-2.48 1.03L3.03 4.56A3.5 3.5 0 0 0 2 7.04v4.92c0 .93.37 1.82 1.03 2.48l6.43 6.44a5 5 0 0 0 7.08 0l4.34-4.34a5 5 0 0 0 0-7.08l-6.44-6.43A3.5 3.5 0 0 0 11.96 2zm4.92 2q.62.01 1.07.44l6.43 6.44a3 3 0 0 1 0 4.24l-4.34 4.34a3 3 0 0 1-4.24 0l-6.44-6.43A1.5 1.5 0 0 1 4 11.96V7.04q.01-.62.44-1.07l1.53-1.53A1.5 1.5 0 0 1 7.04 4z" /></svg>
                                        <span>Tags</span>
                                    </button>
                                    <button type="button" role="menuitem" @click.stop="copyRawTweet(panelThreadData.main)"
                                            class="flex w-full items-center gap-3 px-4 py-3 text-left text-[15px] font-bold text-[var(--text-primary)] hover:bg-[var(--hover-bg)]">
                                        <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current flex-shrink-0" aria-hidden="true" fill="currentColor"><path d="m15.45 4.3-5 16-1.9-.6 5-16zM6.78 7.63 3.28 12l3.5 4.38-1.56 1.25L.72 12l4.5-5.62zM23.28 12l-4.5 5.63-1.56-1.25 3.5-4.38-3.5-4.37 1.56-1.25z" /></svg>
                                        <span>Copy raw</span>
                                    </button>
                                    <button type="button" role="menuitem" @click.stop="openTweetHistory(panelThreadData.main.tweet_id)"
                            class="flex w-full items-center gap-3 px-4 py-3 text-left text-[15px] font-bold text-[var(--text-primary)] hover:bg-[var(--hover-bg)]">
                        <svg class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 1 1-9.43 10.62l1.98-.24A7.5 7.5 0 1 0 6.41 7H9.5v2h-6V3h2v2.07A9.5 9.5 0 0 1 12 2.5"/><path d="m13 11.59 3.2 3.2-1.4 1.42-3.8-3.8V8h2z"/></svg>
                        <span>History</span>
                    </button>
                    <button type="button" role="menuitem" x-show="hasNoteHistory(panelThreadData.main)" @click.stop="openNoteHistory(panelThreadData.main.tweet_id)"
                                            class="flex w-full items-center gap-3 px-4 py-3 text-left text-[15px] font-bold text-[var(--text-primary)] hover:bg-[var(--hover-bg)]">
                                        <svg class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a6 6 0 0 1 6 6v2H6v-2a6 6 0 0 1 6-6m-6.24 1A8 8 0 0 0 4 18v1H0v-1a5 5 0 0 1 5-5zM19 13a5 5 0 0 1 5 5v1h-4v-1c0-1.9-.66-3.63-1.76-5zM4.25 5.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6m15.5 0a3 3 0 1 1 0 6 3 3 0 0 1 0-6M12 3.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7" /></svg>
                                        <span>Community notes</span>
                                    </button>
                                    <button type="button" role="menuitem" @click.stop="setTweetHidden(panelThreadData.main.tweet_id, !panelThreadData.main.hidden)"
                                            class="flex w-full items-center gap-3 px-4 py-3 text-left text-[15px] font-bold text-[var(--text-primary)] hover:bg-[var(--hover-bg)]">
                                        <svg x-show="!panelThreadData.main.hidden" viewBox="0 0 24 24" class="w-5 h-5 flex-shrink-0" fill="currentColor" aria-hidden="true" fill-rule="evenodd" clip-rule="evenodd"><path d="M20.4 16.63c1.14-1.4 2-2.96 2.67-4.63l-.02-.06q-.91-2.34-2.44-4.3l-1.43 1.42A16 16 0 0 1 20.91 12q-.12.3-.37.79c-.37.7-.93 1.64-1.7 2.58C17.33 17.25 15.09 19 12 19q-1.29-.01-2.38-.37l-1.55 1.54A10 10 0 0 0 12 21c3.92 0 6.68-2.25 8.4-4.37M2.7 22.7l20-20-1.4-1.4-3.57 3.55A10 10 0 0 0 12 3C8.08 3 5.32 5.25 3.6 7.37A17 17 0 0 0 .93 12a17 17 0 0 0 3.8 5.86L1.28 21.3zM12 5C8.92 5 6.68 6.75 5.15 8.63A16 16 0 0 0 3.08 12l.38.79a16 16 0 0 0 2.68 3.66l2.41-2.42a4 4 0 0 1 5.48-5.48L16.3 6.3A8 8 0 0 0 12 5m0 5a2 2 0 0 0-1.93 2.52l2.45-2.45A2 2 0 0 0 12 10" /></svg>
                                        <svg x-show="panelThreadData.main.hidden" viewBox="0 0 24 24" class="w-5 h-5 flex-shrink-0" fill="currentColor" aria-hidden="true" fill-rule="evenodd" clip-rule="evenodd"><path d="M20.4 7.37C18.68 5.25 15.92 3 12 3S5.32 5.25 3.6 7.37a18 18 0 0 0-2.5 4.17l-.02.07v.02l-.02.02-.13.35.13.35v.01l.02.03.03.07a11 11 0 0 0 .58 1.25c.41.8 1.04 1.86 1.9 2.92C5.33 18.75 8.09 21 12 21s6.68-2.25 8.4-4.37a18 18 0 0 0 2.5-4.17l.02-.07.01-.03.14-.36-.13-.35v-.01l-.02-.03-.03-.07a11 11 0 0 0-.58-1.25c-.41-.8-1.04-1.86-1.9-2.92M12 5C8.92 5 6.68 6.75 5.15 8.63A16 16 0 0 0 3.08 12l.38.79c.37.7.93 1.64 1.7 2.58C6.67 17.25 8.91 19 12 19s5.32-1.75 6.85-3.63A16 16 0 0 0 20.9 12q-.12-.3-.37-.79a16 16 0 0 0-1.7-2.58C17.33 6.75 15.09 5 12 5" /><path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0m-2 0a2 2 0 1 0-4 0 2 2 0 0 0 4 0" /></svg>
                                        <span x-text="panelThreadData.main.hidden ? 'Unhide' : 'Hide'"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <template x-if="getReplyRecipients(panelThreadData.main).length && panelThreadData.parents.length === 0">
                            <div class="tweet-reply-context text-[15px] text-[var(--text-secondary)] mb-2" x-html="renderReplyRecipientContent(panelThreadData.main)" @click="handleReplyRecipientClick($event)"></div>
                        </template>
                        <div class="tweet-text-detail text-[17px] whitespace-pre-wrap break-words" x-html="formatText(panelThreadData.main, true)" @click="handleTextClick($event)"></div>
                        <div x-html="renderCard(panelThreadData.main, 'detail')" @click.stop></div>
                        <div x-html="renderMediaGrid(panelThreadData.main.media, 'detail', panelThreadData.main)" @click="stopMediaClick($event)"></div>

                        <!-- Quote Tweet -->
                        <template x-if="getQuoteTweet(panelThreadData?.main)">
                            <div class="main-tweet-quote" :class="{ 'main-tweet-quote-after-single-media': (panelThreadData.main.media || []).length === 1 }">
                                <template x-if="isTombstone(getQuoteTweet(panelThreadData?.main))">
                                    <div x-html="renderQuotePlaceholder(getQuoteTweet(panelThreadData?.main))" @click.stop></div>
                                </template>
                                <template x-if="!isTombstone(getQuoteTweet(panelThreadData?.main))">
                                    <div class="quote-card quote-card-detail mt-3 border border-[var(--border-color)] rounded-xl p-3 hover-bg transition cursor-pointer" :data-thread-id="getTweetId(getQuoteTweet(panelThreadData?.main))" @click.stop="openThread(getTweetId(getQuoteTweet(panelThreadData?.main)), false, true)">
                                        <div class="quote-byline flex items-center space-x-1 text-[15px] mb-1">
                                            <div class="avatar w-6 h-6 rounded-full flex-shrink-0 relative bg-[var(--gray-700)] flex items-center justify-center font-bold text-[var(--white-icon)] uppercase text-xs overflow-hidden">
                                                <span class="avatar-initial" x-text="getQuoteAuthor(getQuoteTweet(panelThreadData?.main)).initial"></span>
                                                <img :src="avatarUrl(getQuoteAuthor(getQuoteTweet(panelThreadData?.main)).id)" @load="avatarLoaded($el)" @error="avatarFailed($el)" class="avatar-image absolute inset-0 w-full h-full object-cover z-10" loading="lazy">
                                            </div>
                                            <span class="font-bold text-[var(--text-primary)] truncate tweet-byline-name" x-text="getQuoteAuthor(getQuoteTweet(panelThreadData?.main)).name"></span>
                                            <span class="text-[var(--text-secondary)] tweet-byline-detail tweet-byline-handle" x-text="'@' + getQuoteAuthor(getQuoteTweet(panelThreadData?.main)).screen_name"></span>
                                            <span class="text-[var(--text-secondary)]">·</span>
                                            <span class="text-[var(--text-secondary)] tweet-byline-detail" x-text="formatDate(getQuoteTweet(panelThreadData?.main)?.legacy?.created_at || getQuoteTweet(panelThreadData?.main)?.created_at)"></span>
                                            <span class="quote-missing-slot" x-html="missingBadge(getQuoteTweet(panelThreadData?.main))" @click.stop="openTweetHistory(getTweetId(getQuoteTweet(panelThreadData?.main)))"></span>
                                        </div>
                                        <template x-if="getReplyRecipients({raw_json: getQuoteTweet(panelThreadData?.main)}).length">
                                            <div class="tweet-reply-context text-[15px] text-[var(--text-secondary)] mb-1" x-html="renderReplyRecipientContent({raw_json: getQuoteTweet(panelThreadData?.main)})" @click="handleReplyRecipientClick($event)"></div>
                                        </template>
                                        <div class="quote-text text-[15px] whitespace-pre-wrap leading-normal break-words" x-html="formatText(getQuoteTweet(panelThreadData?.main))" @click="handleTextClick($event)"></div>
                                        <div x-html="renderCard({raw_json: getQuoteTweet(panelThreadData?.main)})" @click.stop></div>
                                        <div class="quote-media" x-html="renderMediaGrid(panelThreadData?.main?.qt_media, (panelThreadData.main.media || []).length ? 'quote-detail-expanded' : 'quote-detail', getQuoteTweet(panelThreadData.main))" @click="stopMediaClick($event)"></div>
                                        <div x-html="renderNestedQuote(getQuoteTweet(panelThreadData?.main))" @click="openNestedQuote($event)" @load.capture="avatarEvent($event)" @error.capture="avatarEvent($event)"></div>
                                        <div x-html="renderCommunityNote(getQuoteTweet(panelThreadData?.main), true, false, Boolean(panelThreadData?.main?.qt_media?.length))" @click.stop></div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <div x-html="renderCommunityNote(panelThreadData.main.raw_json, false, true)" @click.stop></div>
                        <div class="tweet-timestamp text-[var(--text-secondary)] flex flex-wrap items-center justify-between gap-x-2 gap-y-1">
                            <div class="tweet-timestamp-meta flex flex-wrap items-center gap-x-1">
                                <div class="roll-wrapper cursor-default">
                                    <div class="roll-inner">
                                        <span class="roll-item" x-text="formatDate(panelThreadData.main.created_at, true)"></span>
                                        <span class="roll-item text-[var(--accent-color)] font-medium" x-text="formatSyncDate(panelThreadData.main)"></span>
                                    </div>
                                </div>
                                <template x-if="Number(panelThreadData?.main?.raw_json?.views?.count) > 0">
                                    <span class="tweet-detail-views"><span>·</span> <span class="tweet-detail-views-count" x-text="formatCompactCount(panelThreadData?.main?.raw_json?.views?.count)"></span> <span>Views</span></span>
                                </template>
                            </div>
                            <template x-if="panelThreadData.main.local_quote_count > 0">
                                <button @click="openQuotes(panelThreadData.main.tweet_id, true)" class="tweet-detail-quotes text-[var(--accent-color)] hover:underline text-[15px] font-medium transition">
                                    Browse <span x-text="panelThreadData.main.local_quote_count"></span> Quote Tweets
                                </button>
                            </template>
                        </div>
                        <div x-html="renderActionBar(panelThreadData.main, true)"></div>
                    </div>

                    <!-- CHILDREN / REPLIES -->
                    <template x-if="panelThreadData.partial">
                        <div class="p-6 text-center text-[var(--text-secondary)]" role="status">Loading conversation...</div>
                    </template>
                    <template x-for="child in visibleReplies(threadReplies(panelThreadData, panelOtherReplies), panelReplyLimit)" :key="child.tweet_id">
                        <div class="tweet-border">
                            <template x-if="child.tweet_id === firstOtherReplyId(panelThreadData, panelOtherReplies)">
                                <h2 class="px-4 pt-4 pb-1 text-xl font-extrabold text-[var(--text-primary)]">Other replies</h2>
                            </template>
                            <div class="px-4 py-3 flex relative cursor-pointer hover-bg" :data-thread-id="child.tweet_id" @click="openThread(child.tweet_id, false, true)">
                                <template x-if="child.op_replies && child.op_replies.length > 0">
                                    <div class="thread-connector-down w-0.5 bg-[var(--thread-line)] absolute bottom-0 left-[36px] -translate-x-1/2 z-0"></div>
                                </template>
                                <div class="avatar w-10 h-10 rounded-full flex-shrink-0 relative bg-[var(--gray-700)] flex items-center justify-center font-bold text-[var(--white-icon)] uppercase overflow-hidden z-10 mr-2" @click.stop="openProfileCard($event, child)">
                                    <span class="avatar-initial" x-text="getInitial(child)"></span>
                                    <img :src="avatarUrl(child.author.id)" @load="avatarLoaded($el)" @error="avatarFailed($el)" class="avatar-image absolute inset-0 w-full h-full object-cover z-10" loading="lazy">
                                </div>
                                <div class="flex-1 min-w-0 z-10">
                                    <div class="tweet-byline flex items-center space-x-1 text-[15px]">
                                        <span class="font-bold text-[var(--text-primary)] truncate hover:underline tweet-byline-name" @click.stop="openProfileCard($event, child)" x-text="child.author.display_name || 'Unknown'"></span>
                                        <span class="text-[var(--text-secondary)] tweet-byline-detail tweet-byline-handle" x-text="'@' + (child.author.username || 'unknown')"></span>
                                        <span class="text-[var(--text-secondary)]">·</span>
                                        <div class="roll-wrapper text-[var(--text-secondary)] tweet-byline-detail" @click.stop>
                                            <div class="roll-inner">
                                                <span class="roll-item hover:underline" x-text="formatDate(child.created_at)"></span>
                                                <span class="roll-item text-[var(--accent-color)] text-[13px] font-medium" x-text="formatSyncDate(child)"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <template x-if="getReplyRecipients(child).length > 1 || (getReplyTo(child) && getReplyTo(child) !== panelThreadData?.main?.author?.username)">
                                        <div class="tweet-reply-context text-[15px] text-[var(--text-secondary)] mb-1" x-html="renderReplyRecipientContent(child)" @click="handleReplyRecipientClick($event)"></div>
                                    </template>
                                    <div class="tweet-text text-[15px] whitespace-pre-wrap break-words" x-html="formatText(child)" @click="handleTextClick($event)"></div>
                                    <div x-html="renderCard(child)" @click.stop></div>
                                    <div x-html="renderMediaGrid(child.media, 'feed', child)" @click="stopMediaClick($event)"></div>

                                    <!-- Quote Tweet -->
                                    <template x-if="getQuoteTweet(child)">
                                        <div>
                                            <template x-if="isTombstone(getQuoteTweet(child))">
                                                <div x-html="renderQuotePlaceholder(getQuoteTweet(child))" @click.stop></div>
                                            </template>
                                            <template x-if="!isTombstone(getQuoteTweet(child))">
                                                <div class="quote-card mt-3 border border-[var(--border-color)] rounded-xl p-3 hover-bg transition cursor-pointer" :class="{ 'quote-compact': isMediaQuotingMedia(child) }" :data-thread-id="getTweetId(getQuoteTweet(child))" @click.stop="openThread(getTweetId(getQuoteTweet(child)), false, true)">
                                                    <div class="quote-byline flex items-center space-x-1 text-[15px] mb-1">
                                                        <div class="avatar w-6 h-6 rounded-full flex-shrink-0 relative bg-[var(--gray-700)] flex items-center justify-center font-bold text-[var(--white-icon)] uppercase text-xs overflow-hidden">
                                                            <span class="avatar-initial" x-text="getQuoteAuthor(getQuoteTweet(child)).initial"></span>
                                                            <img :src="avatarUrl(getQuoteAuthor(getQuoteTweet(child)).id)" @load="avatarLoaded($el)" @error="avatarFailed($el)" class="avatar-image absolute inset-0 w-full h-full object-cover z-10" loading="lazy">
                                                        </div>
                                                        <span class="font-bold text-[var(--text-primary)] truncate tweet-byline-name" x-text="getQuoteAuthor(getQuoteTweet(child)).name"></span>
                                                        <span class="text-[var(--text-secondary)] tweet-byline-detail tweet-byline-handle" x-text="'@' + getQuoteAuthor(getQuoteTweet(child)).screen_name"></span>
                                                        <span class="text-[var(--text-secondary)]">·</span>
                                                        <span class="text-[var(--text-secondary)] tweet-byline-detail" x-text="formatDate(getQuoteTweet(child)?.legacy?.created_at || getQuoteTweet(child)?.created_at)"></span>
                                                    </div>
                                                    <template x-if="getReplyRecipients({raw_json: getQuoteTweet(child)}).length">
                                                        <div class="quote-reply tweet-reply-context text-[15px] text-[var(--text-secondary)] mb-1" x-html="renderReplyRecipientContent({raw_json: getQuoteTweet(child)})" @click="handleReplyRecipientClick($event)"></div>
                                                    </template>
                                                    <div class="quote-text text-[15px] whitespace-pre-wrap leading-normal break-words" x-html="formatText(getQuoteTweet(child), isMediaQuotingMedia(child))" @click="handleTextClick($event)"></div>
                                                    <div x-html="renderCard({raw_json: getQuoteTweet(child)})" @click.stop></div>
                                                    <div class="quote-media" x-html="isMediaQuotingMedia(child) ? renderQuoteThumbnail(child.qt_media) : renderMediaGrid(child.qt_media, 'quote', getQuoteTweet(child))" @click="if (!isMediaQuotingMedia(child)) stopMediaClick($event)"></div>
                                                    <div x-html="renderNestedQuote(getQuoteTweet(child))" @click="openNestedQuote($event)" @load.capture="avatarEvent($event)" @error.capture="avatarEvent($event)"></div>
                                                    <div x-html="renderCommunityNote(getQuoteTweet(child), true, false, Boolean(child?.qt_media?.length))" @click.stop></div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <div x-html="renderCommunityNote(child.raw_json)" @click.stop></div>
                                    <div x-html="renderActionBar(child)"></div>
                                </div>
                            </div>
                            <!-- Replies to this direct reply (legacy op_replies key) -->
                            <template x-if="child.op_replies && child.op_replies.length > 0">
                                <div>
                                    <template x-for="(reply, rIdx) in child.op_replies" :key="reply.tweet_id">
                                        <div class="thread-nested-row px-4 pb-3 flex relative cursor-pointer hover-bg" :style="{ marginLeft: nestedReplyIndent(reply) + 'px' }" :data-thread-id="reply.tweet_id" @click="openThread(reply.tweet_id, false, true)">
                                            <div class="thread-connector-up w-0.5 bg-[var(--thread-line)] absolute top-0 left-[36px] -translate-x-1/2 z-0"></div>
                                            <template x-if="rIdx < child.op_replies.length - 1">
                                                <div class="thread-connector-down w-0.5 bg-[var(--thread-line)] absolute bottom-0 left-[36px] -translate-x-1/2 z-0"></div>
                                            </template>
                                            <div class="avatar w-10 h-10 rounded-full flex-shrink-0 relative bg-[var(--gray-700)] flex items-center justify-center font-bold text-[var(--white-icon)] uppercase overflow-hidden z-10 mr-2" @click.stop="openProfileCard($event, reply)">
                                                <span class="avatar-initial" x-text="getInitial(reply)"></span>
                                                <img :src="avatarUrl(reply.author.id)" @load="avatarLoaded($el)" @error="avatarFailed($el)" class="avatar-image absolute inset-0 w-full h-full object-cover z-10" loading="lazy">
                                            </div>
                                            <div class="flex-1 min-w-0 z-10">
                                                <div class="tweet-byline flex items-center space-x-1 text-[15px]">
                                                    <span class="font-bold text-[var(--text-primary)] truncate hover:underline tweet-byline-name" @click.stop="openProfileCard($event, reply)" x-text="reply.author.display_name || 'Unknown'"></span>
                                                    <span class="text-[var(--text-secondary)] tweet-byline-detail tweet-byline-handle" x-text="'@' + (reply.author.username || 'unknown')"></span>
                                                    <span class="text-[var(--text-secondary)]">·</span>
                                                    <div class="roll-wrapper text-[var(--text-secondary)] tweet-byline-detail" @click.stop>
                                                        <div class="roll-inner">
                                                            <span class="roll-item hover:underline" x-text="formatDate(reply.created_at)"></span>
                                                            <span class="roll-item text-[var(--accent-color)] text-[13px] font-medium" x-text="formatSyncDate(reply)"></span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <template x-if="getReplyRecipients(reply).length">
                                                    <div class="tweet-reply-context text-[15px] text-[var(--text-secondary)] mb-1" x-html="renderReplyRecipientContent(reply)" @click="handleReplyRecipientClick($event)"></div>
                                                </template>
                                                <div class="tweet-text text-[15px] whitespace-pre-wrap break-words" x-html="formatText(reply)" @click="handleTextClick($event)"></div>
                                                <div x-html="renderCard(reply)" @click.stop></div>
                                                <div x-html="renderMediaGrid(reply.media, 'feed', reply)" @click="stopMediaClick($event)"></div>

                                                <!-- Quote Tweet -->
                                                <template x-if="getQuoteTweet(reply)">
                                                    <div>
                                                        <template x-if="isTombstone(getQuoteTweet(reply))">
                                                            <div x-html="renderQuotePlaceholder(getQuoteTweet(reply))" @click.stop></div>
                                                        </template>
                                                        <template x-if="!isTombstone(getQuoteTweet(reply))">
                                                            <div class="quote-card mt-3 border border-[var(--border-color)] rounded-xl p-3 hover-bg transition cursor-pointer" :class="{ 'quote-compact': isMediaQuotingMedia(reply) }" :data-thread-id="getTweetId(getQuoteTweet(reply))" @click.stop="openThread(getTweetId(getQuoteTweet(reply)), false, true)">
                                                                <div class="quote-byline flex items-center space-x-1 text-[15px] mb-1">
                                                                    <div class="avatar w-6 h-6 rounded-full flex-shrink-0 relative bg-[var(--gray-700)] flex items-center justify-center font-bold text-[var(--white-icon)] uppercase text-xs overflow-hidden">
                                                                        <span class="avatar-initial" x-text="getQuoteAuthor(getQuoteTweet(reply)).initial"></span>
                                                                        <img :src="avatarUrl(getQuoteAuthor(getQuoteTweet(reply)).id)" @load="avatarLoaded($el)" @error="avatarFailed($el)" class="avatar-image absolute inset-0 w-full h-full object-cover z-10" loading="lazy">
                                                                    </div>
                                                                    <span class="font-bold text-[var(--text-primary)] truncate tweet-byline-name" x-text="getQuoteAuthor(getQuoteTweet(reply)).name"></span>
                                                                    <span class="text-[var(--text-secondary)] tweet-byline-detail tweet-byline-handle" x-text="'@' + getQuoteAuthor(getQuoteTweet(reply)).screen_name"></span>
                                                                    <span class="text-[var(--text-secondary)]">·</span>
                                                                    <span class="text-[var(--text-secondary)] tweet-byline-detail" x-text="formatDate(getQuoteTweet(reply)?.legacy?.created_at || getQuoteTweet(reply)?.created_at)"></span>
                                                                </div>
                                                                <template x-if="getReplyRecipients({raw_json: getQuoteTweet(reply)}).length">
                                                                    <div class="quote-reply tweet-reply-context text-[15px] text-[var(--text-secondary)] mb-1" x-html="renderReplyRecipientContent({raw_json: getQuoteTweet(reply)})" @click="handleReplyRecipientClick($event)"></div>
                                                                </template>
                                                                <div class="quote-text text-[15px] whitespace-pre-wrap leading-normal break-words" x-html="formatText(getQuoteTweet(reply), isMediaQuotingMedia(reply))" @click="handleTextClick($event)"></div>
                                                                <div x-html="renderCard({raw_json: getQuoteTweet(reply)})" @click.stop></div>
                                                                <div class="quote-media" x-html="isMediaQuotingMedia(reply) ? renderQuoteThumbnail(reply.qt_media) : renderMediaGrid(reply.qt_media, 'quote', getQuoteTweet(reply))" @click="if (!isMediaQuotingMedia(reply)) stopMediaClick($event)"></div>
                                                                <div x-html="renderNestedQuote(getQuoteTweet(reply))" @click="openNestedQuote($event)" @load.capture="avatarEvent($event)" @error.capture="avatarEvent($event)"></div>
                                                                <div x-html="renderCommunityNote(getQuoteTweet(reply), true, false, Boolean(reply?.qt_media?.length))" @click.stop></div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>

                                                <div x-html="renderCommunityNote(reply.raw_json)" @click.stop></div>
                                                <div x-html="renderActionBar(reply)"></div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                    <div x-show="hasHiddenReplies(threadReplies(panelThreadData, panelOtherReplies), panelReplyLimit)" x-intersect="showMoreReplies(true)" class="p-6 text-center">
                        <button type="button" @click="showMoreReplies(true)" class="text-[var(--accent-color)] hover:underline">Show more replies</button>
                    </div>
                    <div x-show="hasOtherReplies(panelThreadData, panelReplyLimit, panelOtherReplies)" class="tweet-border">
                        <button type="button" @click="showOtherReplies(true)" class="w-full px-4 py-4 text-center text-[15px] text-[var(--accent-color)] hover-bg">Show other replies</button>
                    </div>
                    <template x-if="panelThreadData.reply_tree_truncated">
                        <div class="px-4 py-3 text-[13px] text-[var(--text-secondary)] border-t border-[var(--border-color)]">
                            This conversation has more saved replies than can be shown at once. Open a later reply to continue.
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Panel Quotes View -->
        <div x-show="panelMode === 'quotes'" class="pb-20">
            <template x-if="panelQuotesLoading && panelQuotesList.length === 0">
                <div class="p-8 text-center text-[var(--text-secondary)]">Loading...</div>
            </template>
            <template x-if="!panelQuotesLoading && panelQuotesList.length === 0">
                <div class="p-8 text-center text-[var(--text-secondary)]">No quote tweets found.</div>
            </template>
            <template x-if="panelThreadData && panelThreadData.main">
                <div class="cursor-pointer transition border-b border-[var(--border-color)] pb-3 p-4">
                    <div class="flex flex-col relative">
                        <div class="flex space-x-2">
                            <div class="flex-shrink-0 relative z-10 w-10">
                                <img :src="avatarUrl(panelThreadData.main.author.id)" @load="avatarLoaded($el)" @error="avatarFailed($el)" class="avatar-image w-10 h-10 rounded-full bg-[var(--bg-primary)]" loading="lazy">
                            </div>
                            <div class="flex-1 min-w-0 pb-1">
                                <div class="flex items-center justify-between">
                                    <div class="tweet-byline flex items-center space-x-1 overflow-hidden">
                                        <span class="font-bold text-[15px] truncate text-[var(--text-primary)] hover:underline tweet-byline-name" x-text="panelThreadData.main.author.display_name" @click.stop="openProfileCard($event, panelThreadData.main)"></span>
                                        <span class="text-[15px] text-[var(--text-secondary)] tweet-byline-detail tweet-byline-handle" x-text="'@' + panelThreadData.main.author.username"></span>
                                        <span class="text-[var(--text-secondary)] px-1">·</span>
                                        <span class="text-[var(--text-secondary)] hover:underline tweet-byline-detail" x-text="formatDate(panelThreadData.main.created_at)"></span>
                                    </div>
                                </div>
                                <div class="tweet-text text-[15px] whitespace-pre-wrap break-words" x-html="formatText(panelThreadData.main)" @click="handleTextClick($event)"></div>
                                <div x-html="renderMediaGrid(panelThreadData.main.media, 'feed', panelThreadData.main)" @click="stopMediaClick($event)"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            <template x-for="tweet in panelQuotesList" :key="tweet.tweet_id">
                <div class="tweet-border cursor-pointer hover-bg transition p-4" :data-thread-id="tweet.tweet_id" @click="openThread(tweet.tweet_id, false, true)">
                    <div class="flex space-x-2">
                        <img :src="avatarUrl(tweet.author.id)" @load="avatarLoaded($el)" @error="avatarFailed($el)" class="avatar-image w-10 h-10 rounded-full flex-shrink-0 bg-[var(--bg-primary)]" loading="lazy">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between">
                                <div class="tweet-byline flex items-center space-x-1 overflow-hidden">
                                    <span class="font-bold text-[15px] truncate text-[var(--text-primary)] hover:underline tweet-byline-name" x-text="tweet.author.display_name" @click.stop="openProfileCard($event, tweet)"></span>
                                    <span class="text-[15px] text-[var(--text-secondary)] tweet-byline-detail tweet-byline-handle" x-text="'@' + tweet.author.username"></span>
                                    <span class="text-[var(--text-secondary)] px-1">·</span>
                                    <span class="text-[var(--text-secondary)] hover:underline tweet-byline-detail" x-text="formatDate(tweet.created_at)"></span>
                                </div>
                            </div>
                            <template x-if="getReplyRecipients(tweet).length">
                                <div class="tweet-reply-context text-[15px] text-[var(--text-secondary)] mb-1" x-html="renderReplyRecipientContent(tweet)" @click="handleReplyRecipientClick($event)"></div>
                            </template>
                            <div class="tweet-text text-[15px] whitespace-pre-wrap break-words" x-html="formatText(tweet)" @click="handleTextClick($event)"></div>
                            <div x-html="renderCard(tweet)" @click.stop></div>
                            <div x-html="renderMediaGrid(tweet.media, 'feed', tweet)" @click="stopMediaClick($event)"></div>
                            <div x-html="renderCommunityNote(tweet.raw_json)" @click.stop></div>
                            <div x-html="renderActionBar(tweet)"></div>
                        </div>
                    </div>
                </div>
            </template>
            <div x-intersect.margin.600px="if(!panelQuotesLoadingMore && panelQuotesPage < panelQuotesTotalPages) { panelQuotesPage++; fetchPanelQuotes(true); }" class="h-10"></div>
            <template x-if="panelQuotesLoadingMore">
                <div class="p-4 text-center text-[var(--text-secondary)]">Loading more...</div>
            </template>
        </div>
    </div><!-- /RIGHT PANEL -->
