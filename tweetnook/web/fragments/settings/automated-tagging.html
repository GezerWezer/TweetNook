                                <div class="mb-8">
                                    <h3 class="text-lg font-bold text-[var(--text-primary)] mb-2">Additional user instructions <span class="font-normal text-[var(--text-secondary)]">(optional)</span></h3>
                                    <p class="text-sm text-[var(--text-secondary)] mb-4">Add rules for how you prefer supported subjects to be tagged. Built-in evidence, safety, output, isolation, and tag-count rules always take priority.</p>
                                    <div class="flex items-stretch gap-2">
                                        <label class="nook-input min-w-0 flex-1">
                                            <span class="sr-only">New additional user instruction</span>
                                            <input x-model="automatedTaggingInstructionInput" @keydown.enter.prevent="addAutomatedTaggingInstruction()" maxlength="1000" type="text" placeholder="For example: Prefer original-language film titles.">
                                        </label>
                                        <button type="button" @click="addAutomatedTaggingInstruction()" class="nook-button is-primary shrink-0">Add</button>
                                    </div>
                                    <div x-show="automatedTaggingInstructionItems.length" class="mt-3 space-y-2">
                                        <template x-for="item in automatedTaggingInstructionItems" :key="item">
                                            <div class="flex items-center justify-between gap-3 rounded-lg border border-[var(--border-color)] bg-[var(--bg-secondary)] px-3 py-2">
                                                <span class="min-w-0 break-words text-sm text-[var(--text-primary)]" x-text="item"></span>
                                                <button type="button" @click="removeAutomatedTaggingInstruction(item)" class="nook-icon-button is-xs is-quiet" :aria-label="`Remove ${item}`">
                                                    <svg viewBox="0 0 24 24" aria-hidden="true" class="h-4 w-4 fill-current" fill="currentColor"><path d="M17.7 7.7 13.42 12l4.3 4.3-1.42 1.4-4.3-4.28-4.3 4.3-1.4-1.42 4.28-4.3-4.3-4.3L7.7 6.3l4.3 4.28 4.3-4.3z" /></svg>
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <div id="automated-tagging-test" class="mb-8">
                                    <div>
                                        <h3 class="text-lg font-bold text-[var(--text-primary)]">Test run</h3>
                                        <p class="mt-2 text-sm text-[var(--text-secondary)]">Enter an archived tweet ID to preview it using the settings currently shown above, including unsaved edits.</p>
                                    </div>

                                    <div>
                                        <div class="nook-field"><div class="nook-field-body"><label for="automated-tagging-tweet-id" class="nook-field-label">Archived tweet ID</label>
                                        <input id="automated-tagging-tweet-id" type="text" inputmode="numeric" autocomplete="off" x-model="automatedTaggingTweetId" @input.debounce.350ms="lookupAutomatedTaggingTweet()" @keydown.enter.prevent="lookupAutomatedTaggingTweet()" placeholder="Enter the numeric tweet ID"></div></div>
                                        <p class="mt-2 text-xs text-[var(--text-secondary)]">The ID must belong to a tweet already in your archive.</p>
                                        <p x-show="automatedTaggingTweetLookingUp" class="mt-2 text-sm text-[var(--text-secondary)]">Loading archived tweet…</p>
                                        <p x-show="automatedTaggingTweetLookupError" role="alert" class="mt-2 text-sm text-[var(--destructive-color)]" x-text="automatedTaggingTweetLookupError"></p>
                                    </div>

                                    <div x-show="automatedTaggingSelectedTweet" class="rounded-xl border border-[var(--border-color)] bg-[var(--bg-primary)] p-4">
                                        <div class="flex items-start justify-between gap-3">
                                            <div class="min-w-0">
                                                <p class="truncate text-sm font-bold text-[var(--text-primary)]"><span x-text="automatedTaggingSelectedTweet?.author_display_name || 'Unknown author'"></span> <span class="font-normal text-[var(--text-secondary)]" x-text="automatedTaggingSelectedTweet?.author_username ? `@${automatedTaggingSelectedTweet.author_username}` : ''"></span></p>
                                                <p class="mt-1 text-sm text-[var(--text-primary)]" x-text="automatedTaggingSelectedTweet?.text || '(No tweet text)'"></p>
                                                <p class="mt-1 text-xs text-[var(--text-secondary)]" x-text="`ID ${automatedTaggingSelectedTweet?.tweet_id || ''}`"></p>
                                            </div>
                                            <button type="button" @click="automatedTaggingTweetId = ''; automatedTaggingSelectedTweet = null; automatedTaggingTestResult = null; automatedTaggingTestError = ''; automatedTaggingTweetLookupError = ''" class="nook-button is-text shrink-0">Change</button>
                                        </div>
                                    </div>

                                    <div class="mt-4 flex flex-col gap-3">
                                        <p class="text-xs text-[var(--text-secondary)]"><span class="font-bold text-[var(--accent-color)]">Your settings, descriptions, and tags won't be changed.</span> The test sends one request at a time using your selected Free or Paid mode. Retries or Google Search may use additional quota, and any applicable paid spend and Search usage still count.</p>
                                        <button id="run-automated-tagging-test-btn" type="button" @click="runAutomatedTaggingTest()" :disabled="!automatedTaggingSelectedTweet || automatedTaggingTesting" class="nook-button is-primary is-block" x-text="automatedTaggingTesting ? 'Running test…' : 'Run test'"></button>
                                    </div>

                                    <div x-show="automatedTaggingTestError" role="alert" class="rounded-xl border border-[var(--destructive-color)] p-4 text-sm text-[var(--destructive-color)] whitespace-pre-wrap" x-text="automatedTaggingTestError"></div>

                                    <template x-if="automatedTaggingTestResult?.success">
                                        <div class="rounded-xl border border-[var(--accent-color)] bg-[var(--bg-primary)] p-5 space-y-4">
                                            <div class="flex flex-wrap items-center justify-between gap-2">
                                                <h5 class="font-bold text-[var(--text-primary)]">Generated preview</h5>
                                                <span class="text-xs text-[var(--text-secondary)]" x-text="`${automatedTaggingTestResult.result.model} · ${automatedTaggingTestResult.result.content_type}`"></span>
                                            </div>
                                            <div x-show="automatedTaggingTestResult.result.description">
                                                <p class="text-xs font-bold uppercase tracking-wide text-[var(--text-secondary)]">Description</p>
                                                <p class="mt-1 text-sm leading-relaxed text-[var(--text-primary)]" x-text="automatedTaggingTestResult.result.description"></p>
                                            </div>
                                            <div>
                                                <p class="text-xs font-bold uppercase tracking-wide text-[var(--text-secondary)]">Tags</p>
                                                <div class="mt-2 flex flex-wrap gap-2">
                                                    <template x-for="tag in automatedTaggingTestResult.result.tags" :key="tag"><span class="tag-capsule" x-text="tag"></span></template>
                                                </div>
                                            </div>
                                            <details x-show="automatedTaggingTestResult.output" class="text-sm text-[var(--text-secondary)]">
                                                <summary class="cursor-pointer font-bold">Run details</summary>
                                                <pre class="mt-2 whitespace-pre-wrap break-words font-mono text-xs" x-text="automatedTaggingTestResult.output"></pre>
                                            </details>
                                        </div>
                                    </template>
                                </div>
                                </fieldset>
                            </div>
                        </template>
                    </div>
