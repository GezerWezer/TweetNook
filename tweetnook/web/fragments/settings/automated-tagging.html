                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                                        <label><span class="text-sm font-bold text-[var(--text-secondary)]">Requests per minute</span><input type="number" min="1" x-model.number="automatedTagging.free_rpm" class="mt-1 w-full bg-[var(--bg-primary)] border border-[var(--input-border)] rounded-lg px-3 py-2"></label>

                                <div class="mb-8" x-show="automatedTagging.api_mode === 'paid'">

                                                <option value="stop">Stop immediately</option>
                                            </select>
                                        </label>

                                        </label>
                                        <label class="block" x-show="automatedTagging.unknown_billing_policy === 'reserve'">Maximum uncertain billing requests per UTC day

                                        </label>
                                        <p x-show="automatedTaggingAccounting?.today_unknown_cost_requests">Today: <span x-text="automatedTaggingAccounting.today_unknown_cost_requests"></span> uncertain requests; $<span x-text="automatedTaggingAccounting.today_unknown_reserved_cost_usd || '0'"></span> reserved.</p>

                                                <svg viewBox="0 0 24 24" aria-hidden="true" class="h-5 w-5 fill-current"><g><path d="M9.64 18.952l-5.55-4.861 1.317-1.504 3.951 3.459 8.459-10.948L19.4 6.32 9.64 18.952z"></path></g></svg>
                                            </span>
                                        </span>
                                    </label>

                                        <div class="mt-3 flex min-h-[44px] flex-wrap items-center gap-2 rounded-xl border border-[var(--input-border)] bg-[var(--bg-primary)] p-2 focus-within:border-[var(--accent-color)] transition">

                                                        <svg viewBox="0 0 24 24" class="h-4 w-4 fill-current"><path d="M13.414 12l5.793-5.793c.39-.39.39-1.023 0-1.414s-1.024-.39-1.414 0L12 10.586 6.207 4.793c-.39-.39-1.024-.39-1.414 0s-.39 1.024 0 1.414L10.586 12l-5.793 5.793c-.39.39-.39 1.023 0 1.414.195.195.45.293.707.293s.512-.098.707-.293L12 13.414l5.793 5.793c.195.195.45.293.707.293.39-.39 1.024-1.024 0-1.414L13.414 12z"></path></svg>
                                                    </button>

                                        </div>
                                        <p class="mt-2 text-xs text-[var(--text-secondary)]">Press Enter, Tab, or comma to add a subject. No autocomplete is used here.</p>
                                    </div>
                                </div>

                                                <p class="mt-1 text-xs text-[var(--text-secondary)]" x-text="`ID ${automatedTaggingSelectedTweet?.tweet_id || ''}`"></p>
                                            </div>
                                            <button type="button" @click="automatedTaggingTweetId = ''; automatedTaggingSelectedTweet = null; automatedTaggingTestResult = null; automatedTaggingTestError = ''; automatedTaggingTweetLookupError = ''" class="shrink-0 text-sm font-bold text-[var(--text-secondary)] hover:text-[var(--text-primary)]">Change</button>
                                        </div>
                                    </div>

                                    <div class="mt-4 flex flex-col gap-3">
                                        <p class="text-xs text-[var(--text-secondary)]"><span class="font-bold text-[var(--accent-color)]">Your settings, descriptions, and tags won't be changed.</span> The test sends one request at a time using your selected Free or Paid mode. Retries or Google Search may use additional quota, and any applicable paid spend and Search usage still count.</p>
                                        <button id="run-automated-tagging-test-btn" type="button" @click="runAutomatedTaggingTest()" :disabled="!automatedTaggingSelectedTweet || automatedTaggingTesting" class="w-full rounded-full bg-[var(--accent-color)] px-5 py-2 text-sm font-bold text-white hover:opacity-90 disabled:opacity-50" x-text="automatedTaggingTesting ? 'Running test…' : 'Run test'"></button>
                                    </div>

                                    <div x-show="automatedTaggingTestError" role="alert" class="rounded-xl border border-[var(--destructive-color)] p-4 text-sm text-[var(--destructive-color)] whitespace-pre-wrap" x-text="automatedTaggingTestError"></div>

                                    <template x-if="automatedTaggingTestResult?.success">
                                        <div class="rounded-xl border border-[var(--accent-color)] bg-[var(--bg-primary)] p-5 space-y-4">
                                            <div class="flex flex-wrap items-center justify-between gap-2">
                                                <h5 class="font-bold text-[var(--text-primary)]">Generated preview</h5>
                                                <span class="text-xs text-[var(--text-secondary)]" x-text="`${automatedTaggingTestResult.result.model} · ${automatedTaggingTestResult.result.content_type}`"></span>
                                            </div>
                                            <div x-show="automatedTaggingTestResult.result.description">
                                                <p class="text-xs font-bold uppercase tracking-wide text-[var(--text-secondary)]">Description</p>
                                                <p class="mt-1 text-sm leading-relaxed text-[var(--text-primary)]" x-text="automatedTaggingTestResult.result.description"></p>
                                            </div>
                                            <div>
                                                <p class="text-xs font-bold uppercase tracking-wide text-[var(--text-secondary)]">Tags</p>
                                                <div class="mt-2 flex flex-wrap gap-2">
                                                    <template x-for="tag in automatedTaggingTestResult.result.tags" :key="tag"><span class="tag-capsule" x-text="tag"></span></template>
                                                </div>
                                            </div>
                                            <details x-show="automatedTaggingTestResult.output" class="text-sm text-[var(--text-secondary)]">
                                                <summary class="cursor-pointer font-bold">Run details</summary>
                                                <pre class="mt-2 whitespace-pre-wrap break-words font-mono text-xs" x-text="automatedTaggingTestResult.output"></pre>
                                            </details>
                                        </div>
                                    </template>
                                </div>
                                </fieldset>
                            </div>
                        </template>
                    </div>
