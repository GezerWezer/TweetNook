                    <!-- Tags: one list for browsing, selecting, merging and deleting -->
                    <template x-if="showSettingsModal && settingsTab === 'tags'">
                    <div class="nook-setting-body nook-tags-page" x-data="nookTagsPage()" @keydown.escape="escape($event)" @scroll="menu && closeMenu(false)">
                        <div class="nook-settings-intro" tabindex="-1" x-ref="tagListHeading"><p>Tags you've added to saved tweets.</p><span x-text="summary()"></span></div>
                        <div class="nook-tag-toolbar">
                            <label class="nook-search-pill">
                                <span class="nook-search-pill-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
  <path d="M10.75 1.75a9 9 0 0 1 7.03 14.62l4.43 4.42-1.42 1.42-4.42-4.43a9 9 0 1 1-5.62-16.03m0 2a7 7 0 1 0 0 14 7 7 0 0 0 0-14" />
</svg></span>
                                <input type="search" x-model.debounce.150ms="query" placeholder="Search tags" aria-label="Search tags" autocomplete="off" spellcheck="false">
                            </label>
                            <div class="nook-tag-controls">
                                <div class="nook-segmented" role="radiogroup" aria-label="Sort tags">
                                    <button type="button" role="radio" :aria-checked="sort === 'count'" @click="sort = 'count'">Most used</button>
                                    <button type="button" role="radio" :aria-checked="sort === 'name'" @click="sort = 'name'">A–Z</button>
                                </div>
                                <button type="button" class="nook-secondary-button" :aria-pressed="selecting" @click="toggleSelect()" x-text="selecting ? 'Cancel' : 'Select'"></button>
                            </div>
                        </div>
                        <p class="nook-inline-status" role="status" x-show="status" x-text="status"></p>
                        <div x-show="globalTagsLoading && !globalTags.length" class="nook-empty"><span>Loading tags…</span></div>
                        <div x-show="!globalTagsLoading && rows().length === 0" class="nook-empty">
                            <strong x-text="query ? 'No matching tags' : 'No tags yet'"></strong>
                            <span x-text="query ? 'Check the spelling or try a shorter search.' : 'Tags you add to tweets will appear here.'"></span>
                        </div>
                        <ul class="nook-tag-list" :class="{ 'is-selecting': selecting }" :aria-label="selecting ? 'Select tags to merge' : 'Tags'">
                            <template x-for="tag in rows()" :key="tag.tag">
                                <li class="nook-tag-row" :class="{ 'is-selected': isSelected(tag.tag) }">
                                    <button type="button" class="nook-tag-main" @click="selecting ? toggle(tag.tag) : showTweets(tag.tag)"
                                            :role="selecting ? 'checkbox' : null" :aria-checked="selecting ? isSelected(tag.tag) : null"
                                            :aria-label="selecting ? tag.tag + ', ' + countLabel(tag.count) : 'Show tweets tagged ' + tag.tag + ', ' + countLabel(tag.count)">
                                        <span class="nook-tag-check" x-show="selecting" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
  <path d="M19.4 6.32 9.64 18.95 4.1 14.1l1.32-1.5 3.95 3.46L17.82 5.1z" />
</svg></span>
                                        <span class="nook-tag-copy"><span class="nook-tag-name" x-text="tag.tag"></span><span class="nook-tag-count" x-text="countLabel(tag.count)"></span></span>
                                        <span class="nook-tag-share" aria-hidden="true"><span :style="'width:' + share(tag.count) + '%'"></span></span>
                                    </button>
                                    <button type="button" class="nook-icon-button nook-tag-more" x-show="!selecting" :aria-label="'More options for ' + tag.tag" aria-haspopup="menu" :aria-expanded="menu === tag.tag" @click="openMenu(tag.tag, $el)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
  <circle cx="5" cy="12" r="2" />
  <circle cx="12" cy="12" r="2" />
  <circle cx="19" cy="12" r="2" />
</svg></button>
                                </li>
                            </template>
                        </ul>
                        <nav class="nook-tag-pagination" aria-label="Tag pages" x-show="filteredRows().length > pageSize">
                            <span role="status" x-text="pageLabel()"></span>
                            <button type="button" class="nook-secondary-button" :disabled="currentPage() <= 1" @click="changePage(-1)">Previous</button>
                            <button type="button" class="nook-secondary-button" :disabled="currentPage() >= pageCount()" @click="changePage(1)">Next</button>
                        </nav>
                        <div class="nook-menu" role="menu" x-cloak x-show="menu" x-transition.opacity.duration.100ms :aria-label="menu ? 'Options for ' + menu : ''"
                             :style="'top:' + menuTop + 'px;right:' + menuRight + 'px'" @click.outside="menu && closeMenu(false)" @keydown.arrow-down.prevent="moveMenu(1)" @keydown.arrow-up.prevent="moveMenu(-1)" @keydown.tab="closeMenu(false)">
                            <button type="button" role="menuitem" @click="showTweets(menu)"><span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
  <path d="M15 17h-4v-2h4zm-7.5-6.25a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3M18 13h-7v-2h7z" />
  <path d="M18.5 7a3.5 3.5 0 0 1 3.5 3.5v7a3.5 3.5 0 0 1-3.5 3.5h-13A3.5 3.5 0 0 1 2 17.5v-7A3.5 3.5 0 0 1 5.5 7zm-13 2C4.67 9 4 9.67 4 10.5v7c0 .83.67 1.5 1.5 1.5h13c.83 0 1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5z" />
  <path d="M17 3a2 2 0 0 1 2 2H5c0-1.1.9-2 2-2z" />
</svg></span>Show tweets</button>
                            <button type="button" role="menuitem" @click="startMerge(menu)"><span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
  <path d="m16.59 6-2.8-2.8 1.42-1.4L20.4 7l-5.2 5.2-1.42-1.4L16.6 8H4V6zM8.8 11.8l1.4 1.4L7.42 16H20v2H7.41l2.8 2.8-1.42 1.4L3.6 17z" />
</svg></span>Merge with other tags</button>
                            <button type="button" role="menuitem" class="is-destructive" @click="askDelete(menu)"><span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
  <path d="M11 17H9v-6h2zm4 0h-2v-6h2z" />
  <path d="M13.12 2a3.5 3.5 0 0 1 3.36 2.54L16.9 6H21v2h-1.07l-.77 10.75A3.5 3.5 0 0 1 15.67 22H8.33a3.5 3.5 0 0 1-3.5-3.25L4.08 8H3V6h4.1l.42-1.46A3.5 3.5 0 0 1 10.9 2zM6.07 8l.76 10.6c.06.8.71 1.4 1.5 1.4h7.34c.79 0 1.44-.6 1.5-1.4L17.93 8zm4.82-4a1.5 1.5 0 0 0-1.45 1.09L9.18 6h5.64l-.26-.91A1.5 1.5 0 0 0 13.12 4z" />
</svg></span>Delete tag</button>
                        </div>
                        <div class="nook-selection-bar" x-cloak x-show="selecting">
                            <span x-text="selected.length ? selected.length + ' selected' : 'Select tags to merge'"></span>
                            <button type="button" class="nook-text-button" x-show="selected.length" @click="selected = []">Clear</button>
                            <button type="button" class="nook-primary-button" :disabled="selected.length < 2" @click="openMerge()">Merge</button>
                        </div>

                        <div class="nook-sheet-backdrop" x-cloak x-show="merge" @click.self="merge = false">
                            <div class="nook-sheet" role="dialog" aria-modal="true" aria-labelledby="nook-merge-title" @keydown.tab="trap($event)">
                                <div class="nook-sheet-header">
                                    <button type="button" class="nook-icon-button" @click="merge = false" aria-label="Cancel merge"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
  <path d="M17.7 7.7 13.42 12l4.3 4.3-1.42 1.4-4.3-4.28-4.3 4.3-1.4-1.42 4.28-4.3-4.3-4.3L7.7 6.3l4.3 4.28 4.3-4.3z" />
</svg></button>
                                    <h3 id="nook-merge-title">Merge tags</h3>
                                    <button type="button" class="nook-primary-button" :disabled="busy || !keep" @click="submitMerge()" x-text="busy ? 'Merging…' : 'Merge'"></button>
                                </div>
                                <div class="nook-sheet-body">
                                    <p class="nook-sheet-lede">Choose the name to keep. The other tags are replaced with it on every tweet.</p>
                                    <div role="radiogroup" aria-label="Tag to keep">
                                        <template x-for="name in selected" :key="name">
                                            <button type="button" role="radio" class="nook-choice-row" :aria-checked="keep === name" @click="keep = name">
                                                <span><strong x-text="name"></strong><span x-text="countLabel(countOf(name))"></span></span><span class="nook-radio-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" focusable="false">
  <path d="M19.4 6.32 9.64 18.95 4.1 14.1l1.32-1.5 3.95 3.46L17.82 5.1z" />
</svg></span>
                                            </button>
                                        </template>
                                    </div>
                                    <p class="nook-setting-help" x-text="mergeOutcome()"></p>
                                </div>
                            </div>
                        </div>

                        <div class="nook-sheet-backdrop" x-cloak x-show="confirmDelete" @click.self="confirmDelete = null">
                            <div class="nook-sheet nook-confirm" role="alertdialog" aria-modal="true" aria-labelledby="nook-delete-title" aria-describedby="nook-delete-copy" @keydown.tab="trap($event)">
                                <h3 id="nook-delete-title" x-text="'Delete “' + confirmDelete + '”?'"></h3>
                                <p id="nook-delete-copy" x-text="'This removes the tag from ' + countLabel(countOf(confirmDelete)) + '. It can’t be undone.'"></p>
                                <button type="button" class="nook-destructive-button" :disabled="busy" @click="deleteTag()" x-text="busy ? 'Deleting…' : 'Delete'"></button>
                                <button type="button" class="nook-secondary-button" @click="confirmDelete = null">Cancel</button>
                            </div>
                        </div>
                    </div>
                    </template>
