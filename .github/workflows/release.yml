name: Publish Python distribution

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tweetnook
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out changelog
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: CHANGELOG.md

      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Prepare release notes
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { in_release = 1; next }
            in_release && /^## \[/ { exit }
            in_release && /^### Highlights$/ { in_highlights = 1; print; next }
            in_highlights && /^### / { exit }
            in_highlights { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-highlights.md"

          if ! grep -q '^### Highlights$' "$RUNNER_TEMP/release-highlights.md"; then
            echo "CHANGELOG.md has no Highlights section for $TAG" >&2
            exit 1
          fi

          previous_tag="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            cat "$RUNNER_TEMP/release-highlights.md"
            if [[ -n "$previous_tag" ]]; then
              printf '\nFull changelog: [%s...%s](https://github.com/%s/compare/%s...%s)\n' \
                "$previous_tag" "$TAG" "$REPOSITORY" "$previous_tag" "$TAG"
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GH_REPO" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$TAG" --latest dist/*

  pages:
    name: Deploy GitHub Pages demo
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish
      - release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static demo
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VERSION: ${{ github.ref_name }}
        run: python scripts/build_pages_demo.py --output _dist/pages --version "${VERSION#v}" --base-path "$BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _dist/pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
