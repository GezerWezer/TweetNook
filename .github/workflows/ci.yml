name: CI

on:
  push:
    # Release tags run this workflow through release.yml instead.
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: File size and import direction
        run: uv run python scripts/check_structure.py --strict

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      # Captured CLI output is asserted as text, including supervised workers.
      _TYPER_FORCE_DISABLE_TERMINAL: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Python wrappers run the browser harnesses, and the demo media checks
      # skip without ffmpeg.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Pytest
        run: uv run pytest

  browser-assets:
    name: Browser asset harnesses
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run harnesses
        run: |
          status=0
          for harness in tests/js/test_*.cjs; do
            echo "::group::$harness"
            node "$harness" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  reports:
    name: Reports (not blocking)
    runs-on: ubuntu-latest
    # Pyright still reports errors in existing code; this becomes blocking at zero.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Pyright
        run: uv run --with pyright==1.1.403 pyright tweetnook
