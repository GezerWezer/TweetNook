[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tweetnook"
version = "0.1.0"
description = "Self-hosted Web archive for Twitter/X bookmarks, likes, tweets, and official exports."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["archive", "bookmarks", "cli", "twitter/x", "tweets"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "rich>=13,<14",
  "tqdm>=4.66,<5",
  "typer>=0.12,<1",
  "uvicorn>=0.29,<1",
  "platformdirs>=4.9.4",
]

[project.optional-dependencies]
automated-tagging = [
  "google-genai>=2.12.1,<3",
  "pillow>=10.0,<12.0",
]
legacy-migration = [
  "lancedb>=0.34,<0.35",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.11,<0.12",
]

[project.scripts]
tweetnook = "tweetnook.cli:app"

[project.urls]
Homepage = "https://github.com/gezerwezer/tweetnook"
Repository = "https://github.com/gezerwezer/tweetnook"
Issues = "https://github.com/gezerwezer/tweetnook/issues"

[tool.hatch.build.targets.wheel]
packages = ["tweetnook"]

[tool.hatch.build.targets.sdist]
include = [
  "/tweetnook",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
  "/docs/*.md",
  "/docs/development",
  "/dev/web",
]
exclude = [
  "/.gitignore",
  "/dev/web/node_modules",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
